name: Probe flight APIs from a browser origin

on:
  push:
    branches: [claude/web-app-ideas-7wwit4]
    paths: ['.github/workflows/probe.yml']
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe endpoints
        run: |
          O="Origin: https://mikmok5.github.io"
          UA="User-Agent: Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148 Safari/604.1"
          probe() {
            echo "::group::$1"
            curl -sS -m 20 -D - -o body.txt -H "$O" -H "$UA" "${@:2}" | grep -iE '^HTTP|^access-control|^content-type|^retry-after|^x-ratelimit' || true
            echo "--- body:"; head -c 400 body.txt; echo
            echo "::endgroup::"
          }
          probe fr24-feed "https://data-cloud.flightradar24.com/zones/fcgi/feed.js?bounds=51.7,51.2,-0.9,0.0&faa=1&mlat=1&flarm=1&adsb=1&gnd=1&air=1&estimated=1&maxage=14400&gliders=1&stats=0"
          probe corsproxy-io "https://corsproxy.io/?url=https%3A%2F%2Fapi.adsb.lol%2Fv2%2Fpoint%2F51.47%2F-0.45%2F25"
          probe allorigins-raw "https://api.allorigins.win/raw?url=https%3A%2F%2Fapi.adsb.lol%2Fv2%2Fpoint%2F51.47%2F-0.45%2F25"
          probe codetabs "https://api.codetabs.com/v1/proxy/?quest=https://api.adsb.lol/v2/point/51.47/-0.45/25"
          probe cors-eu "https://cors.eu.org/https://api.adsb.lol/v2/point/51.47/-0.45/25"
          probe corslol "https://api.cors.lol/?url=https%3A%2F%2Fapi.adsb.lol%2Fv2%2Fpoint%2F51.47%2F-0.45%2F25"
          probe everyorigin "https://everyorigin.jwvbremen.nl/api/get?url=https%3A%2F%2Fapi.adsb.lol%2Fv2%2Fpoint%2F51.47%2F-0.45%2F25"
          probe whateverorigin "https://whateverorigin.org/get?url=https%3A%2F%2Fapi.adsb.lol%2Fv2%2Fpoint%2F51.47%2F-0.45%2F25"
          probe corsfix "https://proxy.corsfix.com/?https://api.adsb.lol/v2/point/51.47/-0.45/25"
          probe corsproxy-org "https://corsproxy.org/?https%3A%2F%2Fapi.adsb.lol%2Fv2%2Fpoint%2F51.47%2F-0.45%2F25"
          probe thingproxy "https://thingproxy.freeboard.io/fetch/https://api.adsb.lol/v2/point/51.47/-0.45/25"
          probe htmldriven "https://cors-proxy.htmldriven.com/?url=https://api.adsb.lol/v2/point/51.47/-0.45/25"
          probe allorigins-adsbfi "https://api.allorigins.win/raw?url=https%3A%2F%2Fopendata.adsb.fi%2Fapi%2Fv3%2Flat%2F51.47%2Flon%2F-0.45%2Fdist%2F25"
          probe codetabs-adsbfi "https://api.codetabs.com/v1/proxy/?quest=https://opendata.adsb.fi/api/v3/lat/51.47/lon/-0.45/dist/25"
          probe corsproxy-io-adsbfi "https://corsproxy.io/?url=https%3A%2F%2Fopendata.adsb.fi%2Fapi%2Fv3%2Flat%2F51.47%2Flon%2F-0.45%2Fdist%2F25"
          probe opensky-options -X OPTIONS -H "Access-Control-Request-Method: GET" "https://opensky-network.org/api/states/all?lamin=51.2&lomin=-0.9&lamax=51.7&lomax=0.0"
          probe adsbdb-batch-speed "https://api.adsbdb.com/v0/callsign/RYR59BZ"
