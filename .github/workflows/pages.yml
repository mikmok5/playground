name: Deploy Sky Aquarium to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['sky-aquarium/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Private repos need a paid plan for Pages, so only auto-deploy public ones; manual runs always go.
    if: github.event_name == 'workflow_dispatch' || github.event.repository.private == false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sky-aquarium
      - id: deployment
        uses: actions/deploy-pages@v4
