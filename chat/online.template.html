<title>Bubble Chat</title>
<style>
  :root {
    --bg: #fdf6ff;
    --panel: #ffffff;
    --ink: #2b2140;
    --muted: #7d7298;
    --line: #eadff5;
    --mine: #7c4dff;
    --on-mine: #ffffff;
    --theirs: #f1eafb;
    --online: #20a55a;
    --shadow: rgba(43, 33, 64, .18);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #17121f;
      --panel: #211a2d;
      --ink: #f2ecff;
      --muted: #a79dbd;
      --line: #342a45;
      --mine: #8f63ff;
      --theirs: #2d2440;
      --online: #3ddc84;
      --shadow: rgba(0, 0, 0, .5);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #17121f;
    --panel: #211a2d;
    --ink: #f2ecff;
    --muted: #a79dbd;
    --line: #342a45;
    --mine: #8f63ff;
    --theirs: #2d2440;
    --online: #3ddc84;
    --shadow: rgba(0, 0, 0, .5);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    justify-content: center;
    overflow: hidden;
  }
  .app {
    width: 100%;
    max-width: 720px;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border-inline: 1px solid var(--line);
  }
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 18px; margin: 0; flex: 1; white-space: nowrap; }
  .roster { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
  .pill {
    font-size: 13px;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--theirs);
    white-space: nowrap;
  }
  .pill::before { content: "● "; color: var(--online); }
  .banner {
    margin: 10px 16px 0;
    padding: 10px 12px;
    border-radius: 12px;
    background: var(--theirs);
    font-size: 14px;
    display: flex;
    gap: 8px;
    align-items: flex-start;
  }
  .banner span { flex: 1; }
  .banner button { border: 0; background: none; color: var(--muted); font-size: 18px; cursor: pointer; padding: 0 4px; }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    -webkit-overflow-scrolling: touch;
  }
  .sys { align-self: center; font-size: 13px; color: var(--muted); padding: 4px 0; text-align: center; }
  .row { display: flex; gap: 8px; align-items: flex-end; max-width: 85%; }
  .row.mine { align-self: flex-end; flex-direction: row-reverse; }
  .avatar {
    width: 32px; height: 32px; flex: none;
    border-radius: 50%;
    display: grid; place-items: center;
    font-size: 18px;
  }
  .row.cont .avatar { visibility: hidden; }
  .bubble-wrap { display: flex; flex-direction: column; min-width: 0; }
  .row.mine .bubble-wrap { align-items: flex-end; }
  .name { font-size: 12px; color: var(--muted); margin: 0 10px 2px; }
  .row.cont .name, .row.mine .name { display: none; }
  .bubble {
    padding: 8px 12px;
    border-radius: 18px;
    background: var(--theirs);
    overflow-wrap: anywhere;
    white-space: pre-wrap;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  .row.new .bubble { animation: pop .25s cubic-bezier(.3,1.6,.6,1); }
  .row.mine .bubble { background: var(--mine); color: var(--on-mine); }
  .row .bubble.big, .row .bubble.sticker { background: none; padding: 0 4px; }
  .bubble.big { font-size: 40px; }
  .bubble.sticker img { display: block; width: 96px; height: auto; filter: drop-shadow(0 4px 8px var(--shadow)); }
  .reactions { display: flex; gap: 4px; margin-top: 2px; flex-wrap: wrap; }
  .reactions button {
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    border-radius: 999px;
    font: inherit;
    font-size: 13px;
    padding: 0 6px;
    cursor: pointer;
  }
  .reactions button.me { border-color: var(--mine); }
  .picker, .tray {
    position: fixed;
    background: var(--panel);
    border: 1px solid var(--line);
    box-shadow: 0 6px 24px var(--shadow);
    z-index: 10;
  }
  .picker { display: flex; gap: 2px; border-radius: 999px; padding: 4px 6px; }
  .picker button {
    border: 0; background: none; font-size: 22px; cursor: pointer;
    border-radius: 50%; width: 36px; height: 36px;
    transition: transform .1s;
  }
  .picker button:hover { transform: scale(1.3); }
  .tray {
    left: 12px;
    bottom: calc(70px + env(safe-area-inset-bottom, 0px));
    border-radius: 18px;
    padding: 10px;
    display: flex;
    gap: 8px;
  }
  .tray button {
    border: 0; background: var(--theirs); border-radius: 14px; padding: 6px; cursor: pointer;
  }
  .tray img { display: block; height: 88px; width: auto; }
  #typing { min-height: 20px; padding: 0 16px; font-size: 13px; color: var(--muted); }
  form.composer {
    display: flex;
    gap: 6px;
    padding: 10px 12px;
    border-top: 1px solid var(--line);
  }
  .composer input {
    flex: 1;
    min-width: 0;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink);
    border-radius: 999px;
    padding: 10px 14px;
    font: inherit;
    outline: none;
  }
  .composer input:focus { border-color: var(--mine); }
  .btn {
    border: 0;
    border-radius: 999px;
    background: var(--mine);
    color: var(--on-mine);
    font: inherit;
    font-weight: 600;
    padding: 0 16px;
    cursor: pointer;
  }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.ghost { background: var(--theirs); color: var(--ink); padding: 0; width: 42px; font-size: 20px; flex: none; }
  .btn.ghost img { width: 18px; height: auto; display: block; margin: auto; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--mine); outline-offset: 2px; }

  #join {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    background: var(--bg);
    z-index: 20;
    padding: 16px;
  }
  #join form {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 24px;
    width: 100%;
    max-width: 380px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    text-align: center;
  }
  #join h2 { margin: 0; font-size: 28px; }
  #join p { margin: 0; color: var(--muted); }
  #join input {
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink);
    border-radius: 12px;
    padding: 12px;
    font: inherit;
    text-align: center;
  }
  .choices { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .choices button {
    width: 40px; height: 40px;
    border-radius: 50%;
    border: 2px solid transparent;
    background: var(--theirs);
    font-size: 20px;
    cursor: pointer;
  }
  .choices button.on { border-color: var(--mine); transform: scale(1.1); }
  #join .btn { padding: 12px; }
  .hint { font-size: 12px; color: var(--muted); }

  @keyframes pop { from { transform: scale(.6); opacity: 0; } }
  @keyframes shake {
    10%, 90% { transform: translate(-2px, 1px) rotate(-1deg); }
    20%, 80% { transform: translate(4px, -2px) rotate(1deg); }
    30%, 50%, 70% { transform: translate(-8px, 2px) rotate(-2deg); }
    40%, 60% { transform: translate(8px, -1px) rotate(2deg); }
  }
  .shake { animation: shake .6s; }
  .confetti {
    position: fixed; top: -20px;
    font-size: 24px;
    pointer-events: none;
    z-index: 30;
    animation: fall linear forwards;
  }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
  @media (prefers-reduced-motion: reduce) {
    .row.new .bubble, .shake { animation: none; }
    .confetti { display: none; }
  }
</style>

<div class="app" id="app">
  <header>
    <h1>💬 Bubble Chat</h1>
    <div class="roster" id="roster"></div>
  </header>
  <div class="banner" id="banner" hidden><span id="bannerText"></span><button type="button" id="bannerClose" aria-label="Dismiss">×</button></div>
  <div id="log"><div class="sys">Connecting…</div></div>
  <div id="typing"></div>
  <form class="composer" id="composer">
    <button type="button" class="btn ghost" id="stickerBtn" title="Stickers" aria-label="Stickers"></button>
    <button type="button" class="btn ghost" id="nudge" title="Nudge everyone" aria-label="Nudge everyone">👋</button>
    <input id="text" autocomplete="off" placeholder="Say something…" maxlength="2000" enterkeyhint="send" />
    <button class="btn" id="sendBtn">Send</button>
  </form>
</div>

<div id="join">
  <form id="joinForm">
    <h2>Hey there! 👋</h2>
    <p>Pick a name and a look</p>
    <input id="nameInput" placeholder="Your name" maxlength="24" required autocomplete="nickname" />
    <div class="choices" id="emojis"></div>
    <div class="choices" id="colors"></div>
    <button class="btn">Join the chat</button>
    <div class="hint">Double-tap or long-press a message to react. Try /confetti</div>
  </form>
</div>

<script>
const STICKERS = { drink: "__STICKER_DRINK__" };
const EMOJIS = ["🐸","🦊","🐼","🐙","🦄","🐝","🐧","🦖","👽","🤖","🍕","🌵"];
const COLORS = ["#ffb3c7","#ffd6a5","#fdffb6","#caffbf","#9bf6ff","#a0c4ff","#bdb2ff","#ffc6ff"];
// Stored reaction keys stay plain words; the emoji is only for display.
const REACTIONS = { heart: "❤️", laugh: "😂", wow: "😮", sad: "😢", up: "👍", fire: "🔥" };
const COMMANDS = { "/shrug": "¯\\_(ツ)_/¯", "/tableflip": "(╯°□°)╯︵ ┻━┻", "/unflip": "┬─┬ノ( º _ ºノ)", "/lenny": "( ͡° ͜ʖ ͡°)" };
const WINDOW = 200;
const $ = (s) => document.querySelector(s);

const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const me = Object.assign({ name: "", emoji: EMOJIS[0], color: COLORS[0] }, store.get("bubble-me") || {});
let tabId = store.get("bubble-tab");
if (!tabId) { tabId = "t" + Math.random().toString(36).slice(2, 10); store.set("bubble-tab", tabId); }

let db = null, room = null, user = null, myId = null;
let canWrite = true, joined = false;
let messages = [];          // latest window, oldest first
let firstSnapshot = true;

$("#stickerBtn").innerHTML = `<img alt="" src="${STICKERS.drink}">`;

// ---------- join screen
function renderChoices(el, list, key, paint) {
  el.innerHTML = "";
  for (const v of list) {
    const b = document.createElement("button");
    b.type = "button";
    paint(b, v);
    b.setAttribute("aria-pressed", me[key] === v);
    if (me[key] === v) b.classList.add("on");
    b.onclick = () => { me[key] = v; renderChoices(el, list, key, paint); };
    el.append(b);
  }
}
renderChoices($("#emojis"), EMOJIS, "emoji", (b, v) => { b.textContent = v; b.setAttribute("aria-label", v); });
renderChoices($("#colors"), COLORS, "color", (b, v) => { b.style.background = v; b.setAttribute("aria-label", "Color " + v); });
$("#nameInput").value = me.name;

$("#joinForm").onsubmit = (e) => {
  e.preventDefault();
  me.name = $("#nameInput").value.trim().slice(0, 24);
  if (!me.name) return;
  store.set("bubble-me", { name: me.name, emoji: me.emoji, color: me.color });
  joined = true;
  $("#join").hidden = true;
  unlockAudio();
  room?.presence({ nick: me.name, emoji: me.emoji, color: me.color, id: myId, typing: null }).catch(() => {});
  renderMessages();
};

// ---------- capabilities
function banner(text) {
  $("#bannerText").textContent = text;
  $("#banner").hidden = false;
}
$("#bannerClose").onclick = () => { $("#banner").hidden = true; store.set("bubble-tip-done", true); };

function setReadOnly() {
  canWrite = false;
  for (const el of ["#text", "#sendBtn", "#stickerBtn", "#nudge"]) $(el).disabled = true;
  $("#text").placeholder = "Read only: ask the owner to invite you as an Editor";
}

async function boot() {
  [db, room, user] = await Promise.all([claude.use("db"), claude.use("room"), claude.use("user")]);
  myId = (await user?.id()) ?? null;

  if (!db) {
    $("#log").innerHTML = "";
    addSys("Chat can't connect here. Open this page on claude.ai while signed in.");
    setReadOnly();
    return;
  }
  if ((await user?.can("data.write")) === false) setReadOnly();
  if ((await user?.isOwner()) && !store.get("bubble-tip-done")) {
    banner("To invite a friend: tap Share, add their email, and give them Editor access so they can send messages.");
  }

  db.collection("messages").orderBy("ts", "desc").limit(WINDOW).onSnapshot(onMessages, (err) => {
    addSys("Lost connection to the chat. Reload the page to reconnect.");
    console.warn(err);
  });

  if (room) {
    room.onPeers(renderRoster);
    room.on("nudge", onNudge);
    if (joined) room.presence({ nick: me.name, emoji: me.emoji, color: me.color, id: myId }).catch(() => {});
  }
}
boot();

// ---------- messages
function onMessages(snap) {
  const incoming = snap.docChanges().filter((c) => c.type === "added").map((c) => c.doc);
  messages = snap.docs.map((d) => ({ id: d.id, ...d.data() })).reverse();
  if (!firstSnapshot) {
    for (const d of incoming) {
      const m = d.data();
      if (!m || Date.now() - m.ts > 15000) continue;
      if (/^\/confetti\b/i.test(m.text || "")) confetti();
      if (!isMine(m)) blip();
    }
  }
  renderMessages(firstSnapshot ? null : new Set(incoming.map((d) => d.id)));
  firstSnapshot = false;
}

const isMine = (m) => (myId ? m.by === myId : m.tab === tabId);
const reactKey = () => myId || tabId;

function renderMessages(fresh) {
  const log = $("#log");
  const stick = log.scrollHeight - log.scrollTop - log.clientHeight < 140;
  log.innerHTML = "";
  if (!messages.length) addSys("No messages yet. Say hi 👋");
  let lastFrom = null, lastTs = 0;
  for (const m of messages) {
    if (m.ts - lastTs > 20 * 60 * 1000) {
      addSys(fmtTime(m.ts), false);
      lastFrom = null;
    }
    lastTs = m.ts;
    const from = m.by || m.tab;
    log.append(renderRow(m, lastFrom === from, fresh?.has(m.id)));
    lastFrom = from;
  }
  if (stick || fresh?.size) log.scrollTop = log.scrollHeight;
}

function fmtTime(ts) {
  const d = new Date(ts);
  const today = new Date().toDateString() === d.toDateString();
  return (today ? "" : d.toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" }) + ", ") +
    d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
}

const onlyEmoji = (s) => /^(\p{Extended_Pictographic}|\p{Emoji_Component}|\s|‍|️){1,12}$/u.test(s) && !/^[\d#*\s]+$/.test(s);

function renderRow(m, cont, isNew) {
  const row = document.createElement("div");
  row.className = "row" + (isMine(m) ? " mine" : "") + (cont ? " cont" : "") + (isNew ? " new" : "");

  const av = document.createElement("div");
  av.className = "avatar";
  av.style.background = /^#[0-9a-f]{6}$/i.test(m.color) ? m.color : "#ddd";
  av.textContent = m.emoji || "🙂";

  const wrap = document.createElement("div");
  wrap.className = "bubble-wrap";
  const name = document.createElement("div");
  name.className = "name";
  name.textContent = m.nick || "Someone";
  const bubble = document.createElement("div");
  bubble.title = fmtTime(m.ts);
  if (m.sticker && STICKERS[m.sticker]) {
    bubble.className = "bubble sticker";
    const img = document.createElement("img");
    img.src = STICKERS[m.sticker];
    img.alt = "sticker";
    img.draggable = false;
    bubble.append(img);
  } else {
    const text = String(m.text || "");
    bubble.className = "bubble" + (onlyEmoji(text) ? " big" : "");
    bubble.textContent = text;
  }
  bindReactGesture(bubble, m.id);

  const reactions = document.createElement("div");
  reactions.className = "reactions";
  for (const [key, who] of Object.entries(m.reactions || {})) {
    if (!REACTIONS[key] || !who) continue;
    const ids = Object.keys(who).filter((k) => who[k]);
    if (!ids.length) continue;
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = `${REACTIONS[key]} ${ids.length}`;
    if (ids.includes(reactKey())) b.classList.add("me");
    b.onclick = () => react(m.id, key);
    reactions.append(b);
  }

  wrap.append(name, bubble, reactions);
  row.append(av, wrap);
  return row;
}

function addSys(text, resetScroll = true) {
  const d = document.createElement("div");
  d.className = "sys";
  d.textContent = text;
  $("#log").append(d);
  if (resetScroll) $("#log").scrollTop = $("#log").scrollHeight;
}

async function sendMessage(body) {
  if (!db || !canWrite) return;
  const doc = { ...body, by: myId, tab: tabId, nick: me.name, emoji: me.emoji, color: me.color, ts: Date.now() };
  try {
    await db.collection("messages").add(doc);
    room?.presence({ typing: null }).catch(() => {});
    if (messages.length >= WINDOW) prune();
  } catch (err) {
    if (err?.code === "invalid_argument") {
      setReadOnly();
      addSys("You can read this chat but not send. Ask the owner to give you Editor access.");
    } else if (err?.code === "quota_exceeded") {
      addSys("The chat is full. Old messages need clearing before new ones fit.");
    } else {
      addSys("That message didn't send. Check your connection and try again.");
    }
  }
}

// Keep the store small: drop messages that have scrolled out of the window.
async function prune() {
  const oldest = messages[0]?.ts;
  if (!oldest) return;
  try {
    const old = await db.collection("messages").where("ts", "<", oldest).limit(50).get();
    for (const d of old.docs) await db.doc("messages/" + d.id).delete();
  } catch {}
}

async function react(mid, key) {
  if (!db || !canWrite) return;
  const m = messages.find((x) => x.id === mid);
  const mine = !!m?.reactions?.[key]?.[reactKey()];
  try {
    await db.doc("messages/" + mid).update({ reactions: { [key]: { [reactKey()]: mine ? null : true } } });
  } catch {}
}

// ---------- reaction picker (double-tap / long-press / double-click)
function bindReactGesture(el, mid) {
  let lastTap = 0, press;
  el.addEventListener("dblclick", (e) => openPicker(e.clientX, e.clientY, mid));
  el.addEventListener("touchstart", (e) => {
    const t = e.touches[0];
    const now = Date.now();
    if (now - lastTap < 300) { clearTimeout(press); openPicker(t.clientX, t.clientY, mid); lastTap = 0; return; }
    lastTap = now;
    press = setTimeout(() => openPicker(t.clientX, t.clientY, mid), 450);
  }, { passive: true });
  el.addEventListener("touchend", () => clearTimeout(press));
  el.addEventListener("touchmove", () => clearTimeout(press), { passive: true });
  el.addEventListener("contextmenu", (e) => e.preventDefault());
}

function openPicker(x, y, mid) {
  if (!canWrite) return;
  closePopups();
  const p = document.createElement("div");
  p.className = "picker";
  for (const [key, emoji] of Object.entries(REACTIONS)) {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = emoji;
    b.setAttribute("aria-label", "React " + key);
    b.onclick = () => { react(mid, key); closePopups(); };
    p.append(b);
  }
  document.body.append(p);
  const w = p.offsetWidth;
  p.style.left = Math.max(8, Math.min(x - w / 2, innerWidth - w - 8)) + "px";
  p.style.top = Math.max(8, y - 64) + "px";
  setTimeout(() => addEventListener("pointerdown", outside), 0);
}
function outside(e) { if (!e.target.closest(".picker, .tray, #stickerBtn")) closePopups(); }
function closePopups() {
  document.querySelectorAll(".picker, .tray").forEach((n) => n.remove());
  removeEventListener("pointerdown", outside);
}

// ---------- stickers
$("#stickerBtn").onclick = () => {
  if (document.querySelector(".tray")) return closePopups();
  closePopups();
  const t = document.createElement("div");
  t.className = "tray";
  for (const [key, src] of Object.entries(STICKERS)) {
    const b = document.createElement("button");
    b.type = "button";
    b.setAttribute("aria-label", "Send " + key + " sticker");
    b.innerHTML = `<img alt="" src="${src}">`;
    b.onclick = () => { sendMessage({ sticker: key, text: "" }); closePopups(); };
    t.append(b);
  }
  document.body.append(t);
  setTimeout(() => addEventListener("pointerdown", outside), 0);
};

// ---------- roster + typing (live presence)
let peers = [];
function renderRoster(change) {
  peers = change.peers;
  const el = $("#roster");
  el.innerHTML = "";
  const shown = new Set();
  for (const p of peers) {
    const nick = typeof p.presence.nick === "string" ? p.presence.nick.slice(0, 24) : "";
    const key = p.by || p.presence.id || p.peer;
    if (!nick || shown.has(key)) continue;
    shown.add(key);
    const s = document.createElement("span");
    s.className = "pill";
    s.textContent = `${typeof p.presence.emoji === "string" ? p.presence.emoji.slice(0, 8) : ""} ${nick}${p.isMe ? " (you)" : ""}`;
    el.append(s);
  }
  renderTyping();
}
function renderTyping() {
  const names = peers
    .filter((p) => !p.isMe && p.presence.typing && Date.now() - p.updatedAt < 4000)
    .map((p) => String(p.presence.nick || "Someone").slice(0, 24));
  $("#typing").textContent =
    names.length === 0 ? "" :
    names.length === 1 ? `${names[0]} is typing…` :
    `${[...new Set(names)].join(", ")} are typing…`;
}
setInterval(renderTyping, 1000);

let lastTyping = 0;
$("#text").addEventListener("input", () => {
  if (!room || Date.now() - lastTyping < 1500) return;
  lastTyping = Date.now();
  room.presence({ typing: lastTyping }).catch(() => {});
});

// ---------- composer
$("#composer").onsubmit = (e) => {
  e.preventDefault();
  let text = $("#text").value.trim();
  if (!text || !canWrite) return;
  const cmd = text.toLowerCase();
  if (COMMANDS[cmd]) text = COMMANDS[cmd];
  if (cmd === "/confetti") text = "/confetti 🎉";
  $("#text").value = "";
  sendMessage({ text: text.slice(0, 2000) });
};

// ---------- nudge
let lastNudge = 0;
$("#nudge").onclick = () => {
  if (!room || Date.now() - lastNudge < 3000) return;
  lastNudge = Date.now();
  room.emit("nudge", { nick: me.name, emoji: me.emoji }).catch(() => {});
};
function onNudge(msg) {
  const d = msg.data || {};
  const who = typeof d.nick === "string" && d.nick ? d.nick.slice(0, 24) : "Someone";
  const emoji = typeof d.emoji === "string" ? d.emoji.slice(0, 8) : "";
  addSys(`${emoji} ${msg.isMe ? "You" : who} nudged everyone!`);
  const app = $("#app");
  app.classList.remove("shake");
  void app.offsetWidth;
  app.classList.add("shake");
  navigator.vibrate?.(200);
  blip(220);
}

// ---------- fun bits
let audio;
function unlockAudio() {
  try { audio ||= new (window.AudioContext || window.webkitAudioContext)(); audio.resume?.(); } catch {}
}
addEventListener("pointerdown", unlockAudio, { once: true });
function blip(freq = 660) {
  if (!audio) return;
  try {
    const o = audio.createOscillator();
    const g = audio.createGain();
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.12, audio.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.2);
    o.connect(g).connect(audio.destination);
    o.start();
    o.stop(audio.currentTime + 0.2);
  } catch {}
}

function confetti() {
  const bits = ["🎉","🎊","✨","💖","⭐","🌈"];
  for (let i = 0; i < 50; i++) {
    const s = document.createElement("div");
    s.className = "confetti";
    s.textContent = bits[i % bits.length];
    s.style.left = Math.random() * 100 + "vw";
    s.style.animationDuration = 2 + Math.random() * 2 + "s";
    s.style.animationDelay = Math.random() * 0.8 + "s";
    document.body.append(s);
    setTimeout(() => s.remove(), 5000);
  }
}
</script>
